<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Back Office & AI Co-Pilot — Steven Lenz Jr.</title>
  <link rel="icon" href="/assets/brand/favicon.png" />
  <link rel="manifest" href="/admin/manifest.webmanifest" />
  <meta name="theme-color" content="#0D1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SLJR Co-Pilot" />
  <link rel="apple-touch-icon" href="/assets/brand/favicon.png" />
  <link rel="stylesheet" href="/admin/admin.css?v=12" />
</head>

<body>
  <div id="login" class="login">
    <form id="login-form" class="card login__card" autocomplete="on">
      <div class="login__brand" style="text-align: center; margin-bottom: 20px;">
        <span class="top__brand-name" style="font-size: 1.25rem; letter-spacing: 0.18em; display: block;">Steven Lenz Jr</span>
        <div class="top__brand-compass" style="margin: 4px 0 6px;">
          <img src="/assets/brand/sl-compass-banner.png" alt="Compass" class="top__brand-img" style="height: 24px; margin: 0 auto;" />
        </div>
        <span class="top__brand-sub" style="font-size: 0.7rem; letter-spacing: 0.26em; display: block;">Back Office</span>
      </div>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Enter admin password" required />
      <button class="btn btn--primary" type="submit">Sign in</button>
      <p id="login-msg" class="msg" role="alert" hidden></p>
    </form>
  </div>

  <div id="app" hidden>
    <!-- iOS / Browser PWA Install Prompt Banner -->
    <div id="pwa-install-banner" class="pwa-banner" hidden>
      <div class="pwa-banner__content">
        <img src="/assets/brand/favicon.png" alt="SLJR Icon" class="pwa-banner__icon" />
        <div class="pwa-banner__text">
          <strong>Install SLJR Co-Pilot PWA</strong>
          <p class="small muted">Add to Home Screen for voice mic & hands-free driving mode.</p>
        </div>
      </div>
      <div class="pwa-banner__actions">
        <button id="pwa-install-btn" class="btn btn--primary btn--sm">Install App</button>
        <button id="pwa-dismiss-btn" class="btn btn--quiet btn--sm">✕</button>
      </div>
    </div>

    <header class="top">
      <a href="/admin/#today" class="top__brand" aria-label="Steven Lenz Jr · Compass · Back Office">
        <span class="top__brand-name">Steven Lenz Jr</span>
        <div class="top__brand-compass">
          <img src="/assets/brand/sl-compass-banner.png" alt="Compass" class="top__brand-img" />
        </div>
        <span class="top__brand-sub">Back Office</span>
      </a>

      <div class="tabs-wrap" id="tabs-wrap">
        <button type="button" class="tabs-scroll-btn tabs-scroll-btn--left" id="tabs-scroll-left" aria-label="Scroll left" title="Scroll tabs left">‹</button>
        <nav class="tabs" id="tabs" aria-label="Sections">
          <button data-view="copilot" class="tab-copilot">⚡ Co-Pilot <span class="badge badge--gold" id="badge-copilot">AI</span></button>
          <button data-view="today" class="is-on">Today</button>
          <button data-view="pipeline">Pipeline <span class="badge" id="badge-deals" hidden></span></button>
          <button data-view="contacts">Contacts</button>
          <button data-view="tasks">Tasks <span class="badge" id="badge-tasks" hidden></span></button>
          <button data-view="leads">Leads <span class="badge" id="badge-new" hidden></span></button>
          <button data-view="chat-logs">Chat Logs</button>
        </nav>
        <button type="button" class="tabs-scroll-btn tabs-scroll-btn--right" id="tabs-scroll-right" aria-label="Scroll right" title="Scroll tabs right">›</button>
      </div>

      <!-- Operations Dropdown Menu for secondary tools (placed outside tabs-wrap to prevent overflow clipping) -->
      <div class="tabs-more" id="tabs-more">
        <button type="button" class="tabs-more__btn" id="btn-tabs-more" aria-haspopup="true" aria-expanded="false">
          <span id="tabs-more-label">More</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="tabs-more__menu" id="tabs-more-menu" hidden>
          <button data-view="dashboard" class="tabs-more__item"><span class="tabs-more__icon">📊</span> Dashboard</button>
          <button data-view="listings" class="tabs-more__item"><span class="tabs-more__icon">🏡</span> Listings</button>
          <button data-view="reviews" class="tabs-more__item"><span class="tabs-more__icon">⭐</span> Reviews</button>
          <button data-view="subscribers" class="tabs-more__item"><span class="tabs-more__icon">📬</span> Subscribers</button>
          <button data-view="activity" class="tabs-more__item"><span class="tabs-more__icon">📋</span> Activity & Audit</button>
        </div>
      </div>

      <div class="top__right">
        <button data-view="settings" class="top__settings-btn" id="btn-top-settings" title="CRM & System Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="3" r="1"/><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
        <a href="/" target="_blank" rel="noopener" class="top__link" title="Open Public Website">View site ↗</a>
        <button id="logout" class="btn btn--quiet" title="Sign out of Back Office">Sign out</button>
      </div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>

    <!-- Floating AI Voice Co-Pilot Orb Button -->
    <button id="copilot-voice-orb" class="copilot-voice-orb" aria-label="Talk to Co-Pilot" title="Talk to Co-Pilot">
      <span class="copilot-orb-ring"></span>
      <span class="copilot-orb-core">
        <svg class="copilot-mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </span>
      <span class="copilot-orb-label">Talk</span>
    </button>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile Navigation">
      <button data-nav="today" class="is-active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Today</span>
      </button>
      <button data-nav="pipeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="6" height="18" rx="1"/><rect x="9" y="8" width="6" height="13" rx="1"/><rect x="16" y="13" width="6" height="8" rx="1"/></svg>
        <span>Pipeline</span>
      </button>
      <button data-nav="copilot" class="bottom-nav__copilot">
        <div class="bottom-nav__copilot-orb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
        </div>
        <span>Co-Pilot</span>
      </button>
      <button data-nav="contacts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Contacts</span>
      </button>
      <button data-nav="more" id="btn-bottom-more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        <span>More</span>
      </button>
    </nav>
  </div>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer__backdrop" data-close></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-label="Details">
      <button class="drawer__close" data-close aria-label="Close">×</button>
      <div id="drawer-body"></div>
    </aside>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/admin/admin.js?v=12"></script>
</body>

</html>
